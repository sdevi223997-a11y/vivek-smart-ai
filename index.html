<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek Hindi Voice AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #070b14; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .topbar { background: linear-gradient(90deg, #0f172a, #1e1b4b); padding: 14px 20px; border-bottom: 1px solid #312e81; display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { font-size: 18px; color: #38bdf8; }
        .brand p { font-size: 11px; color: #facc15; font-weight: bold; }
        .voice-btn { background: #1e293b; color: #22c55e; border: 1px solid #22c55e; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .chat-area { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-width: 800px; width: 100%; margin: 0 auto; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.55; }
        .ai-msg { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
        .ai-msg strong { color: #38bdf8; }
        .user-msg { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .status-bar { text-align: center; font-size: 13px; color: #facc15; padding: 6px; font-weight: bold; }
        .input-box { background: #0f172a; padding: 12px 16px; border-top: 1px solid #1e293b; display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; align-items: center; }
        .mic-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 22px; cursor: pointer; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); flex-shrink: 0; }
        .mic-btn.listening { background: #22c55e; box-shadow: 0 0 20px #22c55e; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .input-box input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 14px; outline: none; }
        .send-btn { background: linear-gradient(135deg, #06b6d4, #2563eb); color: #fff; border: none; padding: 12px 20px; border-radius: 24px; font-weight: bold; cursor: pointer; }
        .welcome-pop { position: fixed; inset: 0; background: rgba(7, 11, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px; }
        .welcome-pop h2 { font-size: 28px; color: #38bdf8; margin-bottom: 8px; }
        .welcome-pop p { color: #cbd5e1; font-size: 14px; margin-bottom: 24px; }
        .start-ai-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; border: none; padding: 16px 38px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body>

<div class="welcome-pop" id="welcomePop">
    <div style="font-size:60px; margin-bottom:12px;">🎙️</div>
    <h2>VIVEK VOICE AI ASSISTANT</h2>
    <p>Personal Hindi & English Voice AI • Developed by Vivek (Class 9th)</p>
    <button class="start-ai-btn" onclick="bootAI()">🔊 START VIVEK AI</button>
</div>

<div class="topbar">
    <div class="brand">
        <h1>🤖 Vivek Voice AI</h1>
        <p>Owner: Vivek | A.S.M Convent School</p>
    </div>
    <button class="voice-btn" id="voiceToggle" onclick="toggleVoice()">🔊 Voice: ON</button>
</div>

<div class="chat-area" id="chatArea"></div>
<div class="status-bar" id="statusBar">माइक 🎤 दबाकर हिंदी या अंग्रेज़ी में अपना सवाल पूछें</div>

<div class="input-box">
    <button class="mic-btn" id="micBtn" onclick="startListening()" title="Speak Question">🎤</button>
    <input type="text" id="userInput" placeholder="माइक दबाकर बोलें या यहाँ लिखें..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">SEND ➤</button>
</div>
<script>
    let voiceEnabled = true;

    function speakText(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        let clean = text.replace(/[*#_`<>]/g, '');
        let utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'hi-IN';
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        document.getElementById("voiceToggle").innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        if (!voiceEnabled) window.speechSynthesis.cancel();
    }

    function addBubble(html, isUser) {
        const box = document.getElementById("chatArea");
        const div = document.createElement("div");
        div.className = "msg " + (isUser ? "user-msg" : "ai-msg");
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    function bootAI() {
        document.getElementById("welcomePop").style.display = "none";
        let intro = "नमस्ते विवेक! आपका स्वागत है। अब मेरा दिमाग और भी स्मार्ट हो गया है। आप विज्ञान, गणित के फॉर्मूले, मौसम या दुनिया का कोई भी सवाल पूछ सकते हैं!";
        addBubble("<strong>🤖 Vivek AI:</strong> " + intro, false);
        speakText(intro);
    }

    function startListening() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("कृपया Google Chrome ब्राउज़र का उपयोग करें!");
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;

        const micBtn = document.getElementById("micBtn");
        const statusBar = document.getElementById("statusBar");

        recognition.onstart = () => {
            micBtn.classList.add("listening");
            statusBar.innerText = "🎙️ सुन रहा हूँ विवेक... अपना सवाल बोलिए!";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById("userInput").value = transcript;
            sendMsg();
        };

        recognition.onerror = () => {
            statusBar.innerText = "❌ आवाज़ समझ नहीं आई, कृपया दोबारा माइक दबाएं।";
        };

        recognition.onend = () => {
            micBtn.classList.remove("listening");
            statusBar.innerText = "माइक 🎤 दबाकर हिंदी या अंग्रेज़ी में अपना सवाल पूछें";
        };

        recognition.start();
    }

    async function searchWikiSmart(query, lang) {
        const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const sRes = await fetch(searchUrl);
        const sData = await sRes.json();
        if (sData.query && sData.query.search && sData.query.search.length > 0) {
            const topTitle = sData.query.search[0].title;
            const sumUrl = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topTitle)}`;
            const sumRes = await fetch(sumUrl);
            if (sumRes.ok) {
                const sumData = await sumRes.json();
                if (sumData.extract) {
                    const splitter = lang === 'hi' ? "।" : ".";
                    return sumData.extract.split(splitter).slice(0, 2).join(splitter) + splitter;
                }
            }
        }
        return null;
    }

    async function askRealAI(question) {
        let q = question.toLowerCase().trim();

        if (q.includes("kisne banaya") || q.includes("किसने बनाया") || q.includes("who made")) {
            return "विवेक, मुझे आपने ही बनाया है! आप ए.एस.एम कॉन्वेंट स्कूल सुखपुरा, बलिया के कक्षा 9 के होनहार एआई डेवलपर हैं।";
        }
        if (q.includes("school") || q.includes("स्कूल") || q.includes("asm")) {
            return "विवेक, आपके स्कूल का नाम ए.एस.एम कॉन्वेंट स्कूल है, जो सुखपुरा, बलिया में स्थित है और यहाँ नर्सरी से 12वीं तक पढ़ाई होती है।";
        }
        if (q.includes("principal") || q.includes("प्रिंसिपल") || q.includes("ajit")) {
            return "विवेक, ए.एस.एम कॉन्वेंट स्कूल के प्रिंसिपल सर श्री अजीत कुमार पांडे जी हैं।";
        }
        if (q.includes("होल स्क्वायर") || q.includes("whole square") || q.includes("a+b")) {
            return "विवेक, (a + b) का होल स्क्वायर बराबर होता है: a स्क्वायर प्लस b स्क्वायर प्लस 2ab (a² + b² + 2ab)।";
        }
        if (q.includes("weather") || q.includes("मौसम") || q.includes("तापमान")) {
            try {
                const wRes = await fetch("https://wttr.in");
                if (wRes.ok) {
                    const wText = await wRes.text();
                    return "विवेक, अभी बलिया (उत्तर प्रदेश) का मौसम " + wText.trim() + " है।";
                }
            } catch (e) {}
            return "विवेक, आज भारत के उत्तरी हिस्सों और उत्तर प्रदेश में मौसम सामान्य और सुहावना बना हुआ है।";
        }
        if (q.includes("time") || q.includes("समय") || q.includes("बजे")) {
            let now = new Date().toLocaleTimeString('hi-IN', {hour: '2-digit', minute:'2-digit'});
            return "विवेक, अभी समय हो रहा है " + now + "।";
        }

        try {
            let hiAns = await searchWikiSmart(question, "hi");
            if (hiAns) return "विवेक, " + hiAns;

            let enAns = await searchWikiSmart(question, "en");
            if (enAns) return "Vivek, " + enAns;
        } catch (e) {}

        return "विवेक, '" + question + "' के बारे में अभी सटीक डेटा नहीं मिल पाया। कृपया थोड़ा स्पष्ट शब्द या विषय बोलकर पूछें!";
    }

    async function sendMsg() {
        const inp = document.getElementById("userInput");
        const val = inp.value.trim();
        if (!val) return;
        addBubble(val, true);
        inp.value = "";

        const thinkingBubble = addBubble("<strong>🤖 Vivek AI:</strong> <em>जवाब खोज रहा हूँ विवेक...</em>", false);
        const reply = await askRealAI(val);
        thinkingBubble.innerHTML = "<strong>🤖 Vivek AI:</strong> " + reply;
        speakText(reply);
    }
</script>
</body>
</html>
